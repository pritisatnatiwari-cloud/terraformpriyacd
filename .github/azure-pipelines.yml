trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.9.8'
  resourceGroupName: 'rg-devops-practice'
  location: 'Central India'

stages:

- stage: Validate
  displayName: Terraform Validate

  jobs:
  - job: Validate
    displayName: Init and Validate

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: Terraform Init and Validate
      inputs:
        azureSubscription: 'AzureServiceConnection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          terraform init -input=false
          terraform validate


- stage: Plan
  displayName: Terraform Plan
  dependsOn: Validate

  jobs:
  - job: Plan
    displayName: Terraform Plan

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: Terraform Plan
      inputs:
        azureSubscription: 'AzureServiceConnection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          terraform init -input=false

          terraform plan \
            -input=false \
            -var="subscription_id=$(subscriptionId)" \
            -var="resource_group_name=$(resourceGroupName)" \
            -var="location=$(location)"


- stage: Apply
  displayName: Terraform Apply
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - job: Apply
    displayName: Terraform Apply

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: Terraform Apply
      inputs:
        azureSubscription: 'AzureServiceConnection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          terraform init -input=false

          terraform apply \
            -auto-approve \
            -input=false \
            -var="subscription_id=$(subscriptionId)" \
            -var="resource_group_name=$(resourceGroupName)" \
            -var="location=$(location)"
